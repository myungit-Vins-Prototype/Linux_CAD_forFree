<?xml version="1.0" encoding="UTF-8"?>
<!-- Icona dell'applicazione ForgeCAD: solido con uno smusso (la funzione in
     arancio, come l'accento delle icone dei comandi) sul fondo scuro del tema. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3d4f"/>
      <stop offset="1" stop-color="#111922"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9e6ff"/>
      <stop offset="1" stop-color="#5fb6f2"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a93dc"/>
      <stop offset="1" stop-color="#2468ad"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f62a3"/>
      <stop offset="1" stop-color="#143f6e"/>
    </linearGradient>
    <linearGradient id="chamfer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc163"/>
      <stop offset="1" stop-color="#f06d14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#3f86c8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3f86c8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bg)"/>
  <rect x="13.5" y="13.5" width="229" height="229" rx="52.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>
  <ellipse cx="128" cy="140" rx="104" ry="96" fill="url(#glow)"/>
  <!-- Schizzo di costruzione sotto il solido. -->
  <path d="M46 196 A92 34 0 0 0 210 196" fill="none" stroke="#f08a2a" stroke-opacity="0.75" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="10 9"/>
  <g stroke="#eaf6ff" stroke-opacity="0.9" stroke-width="3.5" stroke-linejoin="round">
    <!-- faccia superiore, accorciata dallo smusso sullo spigolo davanti a destra -->
    <polygon points="128,50 186.6,83.8 115.6,124.8 57,91" fill="url(#top)"/>
    <polygon points="57,91 115.6,124.8 128,145.4 128,214 57,173" fill="url(#left)"/>
    <polygon points="128,145.4 199,104.4 199,173 128,214" fill="url(#right)"/>
    <polygon points="115.6,124.8 186.6,83.8 199,104.4 128,145.4" fill="url(#chamfer)"/>
  </g>
  <!-- riflesso sulla faccia superiore -->
  <polygon points="128,58 175,85 117,118 74,93" fill="#ffffff" fill-opacity="0.18"/>
</svg>
